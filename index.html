<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#167c57"><title>Running Math｜對數律即時練習</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script></head><body><div class="shell"><header><div class="brand"><span class="logo">∑</span><div><strong>Running Math</strong><small data-i18n="subtitle">對數律即時練習</small></div></div><div class="header-tools"><span class="pill" data-i18n="pill">高中數學 · 13 核心觀念</span><label for="language" class="sr-only">Language / 語言</label><select id="language" aria-label="Language / 語言"><option value="zh">繁體中文</option><option value="en">English</option></select></div></header><main><section id="setup" class="panel"><div class="hero"><div class="eyebrow">LOGARITHM PRACTICE</div><h1 data-i18n="heroTitle">練熟對數律，從每一題開始。</h1><p data-i18n="heroText">每題二選一，無限變換數字。手機、電腦都能隨時練習。</p></div><h2 data-i18n="chooseMode">選擇練習模式</h2><div class="mode-grid"><button type="button" class="mode active" data-mode="single"><span class="mode-icon">◎</span><strong data-i18n="single">單一觀念熟練</strong><small data-i18n="singleDesc">選一條公式，持續變換數字</small></button><button type="button" class="mode" data-mode="mixed"><span class="mode-icon">✦</span><strong data-i18n="mixed">混合觀念挑戰</strong><small data-i18n="mixedDesc">綜合運用不同對數律</small></button></div><div id="formulaBox"><label for="formula" data-i18n="chooseFormula">選擇核心觀念</label><select id="formula"></select></div><div class="settings"><div><label for="difficulty" data-i18n="difficulty">難度</label><select id="difficulty"><option value="1" data-i18n="level1">基礎｜整數與簡單分數</option><option value="2" selected data-i18n="level2">進階｜加入根號與小數</option><option value="3" data-i18n="level3">挑戰｜混合數字結構</option></select></div><div><label for="count" data-i18n="count">每回合題數</label><select id="count"><option value="10" data-i18n="q10">10 題</option><option value="20" selected data-i18n="q20">20 題</option><option value="0" data-i18n="infinite">無限練習</option></select></div></div><button id="start" class="primary" data-i18n="start">開始練習 →</button><p class="note" data-i18n="privacy">不需登入，不蒐集姓名或學號。每次練習即時產生題目。</p></section><section id="practice" class="panel hidden"><div class="topline"><button id="back" class="quiet" data-i18n="back">← 返回設定</button><span id="progressLabel">第 1 題</span></div><div class="progress"><div id="bar"></div></div><div class="stats"><span><span data-i18n="correctStat">答對</span> <b id="right">0</b></span><span><span data-i18n="rateStat">正確率</span> <b id="rate">—</b></span><span><span data-i18n="streakStat">連續答對</span> <b id="streak">0</b></span></div><div class="question"><div id="concept" class="eyebrow"></div><div id="prompt" class="math big"></div><p class="instruction" data-i18n="instruction">選出正確答案</p></div><div class="answers"><button class="answer" id="optionA"><span class="letter">A</span><span class="math" id="mathA"></span></button><button class="answer" id="optionB"><span class="letter">B</span><span class="math" id="mathB"></span></button></div><div id="feedback" class="feedback hidden" aria-live="polite"><strong id="verdict"></strong><div id="explain"></div></div><button id="next" class="primary hidden" data-i18n="next">下一題 →</button><p class="note" data-i18n="practiceNote">請先心算再選擇；每題都可以查看簡短解析。</p></section><section id="finish" class="panel hidden"><div class="hero"><div class="eyebrow" data-i18n="doneTag">練習完成</div><h1 data-i18n="doneTitle">完成這一回合！</h1><p id="summary"></p></div><div class="end-actions"><button id="again" class="primary" data-i18n="again">再練一回合 ↻</button><button id="home" class="secondary" data-i18n="home">返回首頁</button></div></section></main><footer data-i18n="footer">Running Math · 用理解累積熟練度</footer></div><script src="config.js"></script><script src="engine.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
